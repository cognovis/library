[project]
name = "library"
version = "2.0.0"
description = "Cognovis Library Engine — deterministic library management"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "ruamel.yaml>=0.18",
    "jsonschema>=4.0",
    "tomlkit>=0.13",
    "mcp>=1.27.1,<2",
]

[project.scripts]
library = "scripts.library:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["scripts", "scripts.lib", "scripts.lib.installers", "scripts.lib.providers"]

[tool.setuptools.package-data]
scripts = ["library.yaml", "bin/*", "bin/lib/*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

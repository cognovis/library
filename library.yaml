  runtime_configs:
    - name: orchestrator-config
      description: 'Composed global orchestrator-config.yml — routing baseline (model tiers, perspective_policy, route_profiles; opus routing, active-context adapters) merged with the global-only overlay (bead_claim/effort_classifier). Deployed to ~/.agents/orchestrator-config.yml by library sync; drift-audited by library audit.'

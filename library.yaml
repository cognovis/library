library:
  scripts:
    - name: ccore
      description: Installable Cognovis developer-workflow CLI with shared deterministic capabilities.
      source: https://github.com/cognovis/ccore
      version: 2026.8.0
      language: python
      output_contract: json-envelope
      default_scope: global
      distribution:
        kind: uv-tool
        package_name: cognovis-core-tools
        executables:
          - ccore
      runtime_requirements:
        binaries:
          - bd
          - git
          - ob
          - uv
      metadata:
        library:
          source_catalog: cognovis-ccore
          inventory: manual
          plane: dev
      tags:
        - origin:original
        - tier:core
    - name: refinement/bead_io
      description: Shared bead-array JSON I/O helpers for refinement scripts.
      source: https://github.com/cognovis/library-core/blob/main/scripts/refinement/bead_io.py
      language: python
      metadata:
        library:
          source_catalog: cognovis-library-core
          inventory: manual
    - name: refinement/verify-premises
      description: Verify bead premise references and linked artifacts for refinement workflows.
      source: https://github.com/cognovis/library-core/blob/main/scripts/refinement/verify-premises.py
      language: python
      requires:
        - script:refinement/bead_io
      metadata:
        library:
          source_catalog: cognovis-library-core
          inventory: manual
    - name: triage/audit_log
      description: Append idempotent JSONL audit rows for triage decisions.
      source: https://github.com/cognovis/library-core/blob/main/scripts/triage/audit_log.py
      language: python
      metadata:
        library:
          source_catalog: cognovis-library-core
          inventory: manual
    - name: triage/present_decisions
      description: Build AskUserQuestion payloads for batched triage decisions.
      source: https://github.com/cognovis/library-core/blob/main/scripts/triage/present_decisions.py
      language: python
      metadata:
        library:
          source_catalog: cognovis-library-core
          inventory: manual
    - name: triage/query_history
      description: Query related closed beads and memory context for triage workflows.
      source: https://github.com/cognovis/library-core/blob/main/scripts/triage/query_history.py
      language: python
      metadata:
        library:
          source_catalog: cognovis-library-core
          inventory: manual
    - name: bead-review/review-prep
      description: Deterministic pre-assembly for the bead-review workflow — skips cache-valid beads via the review gate and builds a context packet (plus a childless-epic/large-effort enrich signal) for the rest. Depends on the beads and bead-reviewer skills being installed (resolves their scripts at runtime).
      source: https://github.com/cognovis/library-core/blob/main/scripts/bead-review/review-prep.py
      language: python
      metadata:
        library:
          source_catalog: cognovis-library-core
          inventory: manual
  skills:
    - name: library
      description: Inspect a repository's Library state and recommend explicit project-local Workspaces or primitives before installation.
      source: https://github.com/cognovis/library-core/blob/main/skills/library/SKILL.md
      metadata:
        library:
          source_catalog: cognovis-library-core
          inventory: convention-scan
          plane: dev
          skill_bundle: file
      tags:
        - origin:original
        - tier:core
        - category:skill
    - name: pvs-schema-analysis
      description: Analyze a PVS database schema and produce an annotated JSON inventory. Use for MSSQL or PostgreSQL PVS onboarding, schema archaeology, and adapter planning. Bundles references/sql-catalog.md (read-only SQL query catalog, classification/anonymization rules, FHIR mapping patterns) alongside SKILL.md.
      source: https://github.com/cognovis/polaris/blob/main/.claude/skills/pvs-schema-analysis/SKILL.md
      tags:
        - origin:original
        - tier:domain
        - category:skill
      metadata:
        library:
          source_catalog: polaris
          inventory: manual
          plane: dev
    - name: impeccable
      description: 'Frontend design skill (Apache-2.0, third-party). Single user-invocable /impeccable command with 23 sub-flows: craft, shape, audit, critique, polish, harden, animate, colorize, distill, optimize, adapt, and more. 7 reference files cover typography, color, spatial design, motion, interaction, responsive design, and UX writing. Built on Anthropic''s frontend-design skill with explicit anti-patterns. Use for any UI work in mira, polaris, or other web/app projects.'
      from_marketplace: pbakaus
      repo: impeccable
      path: .claude/skills/impeccable
      tags:
        - third-party
        - frontend
        - design
        - ui
        - apache-2.0
    - name: agent-forge
      description: Create and review agents (subagents). Use when creating specialized AI assistants, reviewing/auditing existing agents, deciding between agent vs skill vs command, scaffolding judge agents, or asking about agent best practices, multi-agent pipelines, and model selection. Also use when separating provider-neutral core prompts from harness adapters. MUST BE USED when the user says "create agent", "new subagent", "review agent", "audit agent", "agent vs skill", or asks about multi-agent architecture.
      source: https://github.com/cognovis/library-core/blob/main/skills/agent-forge/SKILL.md
      requires:
        - standard:agentic-primitives
        - standard:primitive-placement
        - standard:judge-layer
      metadata:
        library:
          source_catalog: cognovis-library-core
          plane: dev
          steward: cognovis-library-core
      tags:
        - origin:original
        - tier:core
    - name: hook-forge
      description: Create and manage Claude Code lifecycle hooks. Use when adding security hooks, lifecycle automation, or troubleshooting PreToolUse/PostToolUse. Triggers on create hook, hook-forge, hook-creator, hooks. Enforces 0=info/pass, 1=hook-error, 2=block.
      source: https://github.com/cognovis/library-core/blob/main/skills/hook-forge/SKILL.md
      requires:
        - standard:agentic-primitives
        - standard:primitive-placement
      metadata:
        library:
          source_catalog: cognovis-library-core
          plane: dev
          steward: cognovis-library-core
      tags:
        - origin:original
        - tier:domain
    - name: mcp-forge
      description: 'use when: creating a Python MCP server or migrating a Python MCP server to the stateless 2026-07-28 protocol with the official Python SDK v2. NOT for: non-Python servers. boundary: this skill owns generic Python MCP server architecture, implementation, migration, and conformance.'
      source: https://github.com/cognovis/library-core/blob/main/skills/mcp-forge/SKILL.md
      requires:
        - standard:python
        - standard:judge-layer
      runtime_requirements:
        binaries:
          - uv
      scripts:
        - path: scripts/audit_mcp_v1.py
          role: helper
          entrypoint: true
          language: python
          output_contract: json-envelope
      metadata:
        library:
          source_catalog: cognovis-library-core
          plane: dev
          steward: cognovis-library-core
      tags:
        - origin:original
        - tier:domain
    - name: skill-forge
      description: 'Create, validate, and audit skills (SKILL.md files). Use when creating a new skill, validating an existing skill for quality and extractable-code violations, or running a full fleet audit. Triggers on: create skill, skill-forge, new skill, validate skill, check skill, audit skills, skill health check, fleet quality, skill creation, action_boundary declarations, script declarations, provider-neutral skill design.'
      source: https://github.com/cognovis/library-core/blob/main/skills/skill-forge/SKILL.md
      requires:
        - standard:agentic-primitives
        - standard:primitive-placement
        - standard:judge-layer
      metadata:
        library:
          source_catalog: cognovis-library-core
          plane: dev
          steward: cognovis-library-core
      tags:
        - origin:original
        - tier:domain
    - name: script-forge
      description: Create, validate, and catalog first-class Python script primitives for the Library. Use when deterministic helper logic should be reusable across skills, agents, hooks, standards, or commands. Triggers on create script, script-forge, first-class script, Python helper, reusable validation script, doctor script, or formula script.
      source: https://github.com/cognovis/library-core/blob/main/skills/script-forge/SKILL.md
      requires:
        - standard:agentic-primitives
        - standard:primitive-placement
      scripts:
        - path: scripts/init-script.py
          role: entrypoint
          entrypoint: true
          language: python
          output_contract: bare-value
      metadata:
        library:
          source_catalog: cognovis-library-core
          plane: dev
          steward: cognovis-library-core
      tags:
        - origin:original
        - tier:domain
    - name: standard-forge
      description: Scaffold or validate a Library standard — a factual, harness-injected markdown context file that skills and agents declare via `requires_standards`. Use when creating a new standard, validating an existing one, deciding "is this a standard or a skill?", scaffolding judge-layer Action Proposal or Mandate standards, or wiring `requires_standards:` into a skill. Triggers on create standard, new standard, standard-forge, scaffold standard, validate standard, check standard, requires_standards.
